name: natively_bluetooth_android
description: Android implementation of the natively_bluetooth plugin.
version: 5.0.0
resolution: workspace
homepage: https://github.com/buildnatively/natively_bluetooth

environment:
  sdk: ^3.6.0
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  natively_bluetooth_platform_interface: ^5.0.0

# uncomment for platform interface local development
#dependency_overrides:
#  natively_bluetooth_platform_interface:
#    path: ../natively_bluetooth_platform_interface

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: natively_bluetooth
    platforms:
      android:
        package: com.lib.natively_bluetooth
        pluginClass: NativelyBluetoothPlugin
        dartPluginClass: NativelyBluetoothAndroid
