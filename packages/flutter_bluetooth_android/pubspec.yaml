name: flutter_bluetooth_android
description: Android implementation of the flutter_bluetooth plugin.
version: 4.0.6
homepage: https://github.com/buildnatively/flutter_bluetooth

environment:
  sdk: ^3.0.0
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bluetooth_platform_interface: ^4.0.2

# uncomment for platform interface local development
#dependency_overrides:
#  flutter_bluetooth_platform_interface:
#    path: ../flutter_bluetooth_platform_interface

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_bluetooth
    platforms:
      android:
        package: com.lib.flutter_bluetooth
        pluginClass: FlutterBluetoothPlugin
        dartPluginClass: FlutterBluetoothAndroid
