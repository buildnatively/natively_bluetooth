name: flutter_bluetooth_linux
description: Linux implementation of the flutter_bluetooth plugin.
version: 5.0.0
homepage: https://github.com/buildnatively/flutter_bluetooth

environment:
  sdk: ^3.0.0
  flutter: '>=3.7.0'

dependencies:
  bluez: '>=0.7.8 <0.9.0'
  flutter:
    sdk: flutter
  flutter_bluetooth_platform_interface: 5.0.0
  rxdart: '>=0.27.0 <0.29.0'

# uncomment for platform interface local development
#dependency_overrides:
#  flutter_bluetooth_platform_interface:
#    path: ../flutter_bluetooth_platform_interface

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: flutter_bluetooth
    platforms:
      linux:
        dartPluginClass: FlutterBluetoothLinux
