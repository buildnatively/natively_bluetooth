name: flutter_bluetooth
description: Flutter plugin for connecting and communicating with Bluetooth Low Energy devices.
version: 1.35.6
homepage: https://github.com/buildnatively/flutter_bluetooth

environment:
  sdk: ^3.0.0
  flutter: '>=3.7.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bluetooth_android: 5.0.0
  flutter_bluetooth_darwin: 5.0.0
  flutter_bluetooth_linux: 5.0.0
  flutter_bluetooth_platform_interface: 5.0.0
  flutter_bluetooth_web: 5.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        default_package: flutter_bluetooth_android
      ios:
        default_package: flutter_bluetooth_darwin
      linux:
        default_package: flutter_bluetooth_linux
      macos:
        default_package: flutter_bluetooth_darwin
      web:
        default_package: flutter_bluetooth_web
