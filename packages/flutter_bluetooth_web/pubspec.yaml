name: flutter_bluetooth_web
description: Web implementation of the flutter_bluetooth plugin.
version: 5.0.0
resolution: workspace
homepage: https://github.com/buildnatively/flutter_bluetooth

environment:
  sdk: ^3.6.0
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bluetooth_platform_interface: '>=5.0.0 <6.0.0'
  flutter_web_plugins:
    sdk: flutter
  web: '>=0.5.0 <2.0.0'

# uncomment for platform interface local development
#dependency_overrides:
#  flutter_bluetooth_platform_interface:
#    path: ../flutter_bluetooth_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: flutter_bluetooth
    platforms:
      web:
        pluginClass: FlutterBluetoothWeb
        fileName: flutter_bluetooth_web.dart
