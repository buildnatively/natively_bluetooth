name: natively_bluetooth_linux
description: Linux implementation of the natively_bluetooth plugin.
version: 5.0.0
resolution: workspace
homepage: https://github.com/buildnatively/natively_bluetooth

environment:
  sdk: ^3.6.0
  flutter: '>=3.7.0'

dependencies:
  bluez: '>=0.7.8 <0.9.0'
  flutter:
    sdk: flutter
  natively_bluetooth_platform_interface: 5.0.0
  rxdart: '>=0.27.0 <0.29.0'

# uncomment for platform interface local development
#dependency_overrides:
#  natively_bluetooth_platform_interface:
#    path: ../natively_bluetooth_platform_interface

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: natively_bluetooth
    platforms:
      linux:
        dartPluginClass: NativelyBluetoothLinux
